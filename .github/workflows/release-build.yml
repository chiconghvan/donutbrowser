name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          NEXT_PUBLIC_TURNSTILE: ${{ secrets.NEXT_PUBLIC_TURNSTILE }}
        run: pnpm exec next build

      - name: Build sidecar binary
        run: pnpm cargo build --bin donut-proxy --release

      - name: Build Tauri app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_TURNSTILE: ${{ secrets.NEXT_PUBLIC_TURNSTILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --verbose

      - name: Create portable Windows ZIP
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PORTABLE_DIR="Donut-Portable"
          mkdir -p "$PORTABLE_DIR"

          # Copy main executable
          cp "src-tauri/target/release/donutbrowser.exe" "$PORTABLE_DIR/Donut.exe"

          # Copy sidecar binary
          cp "src-tauri/target/release/donut-proxy.exe" "$PORTABLE_DIR/"

          # Copy WebView2Loader if present
          if [ -f "src-tauri/target/release/WebView2Loader.dll" ]; then
            cp "src-tauri/target/release/WebView2Loader.dll" "$PORTABLE_DIR/"
          fi

          # Create .portable marker
          touch "$PORTABLE_DIR/.portable"

          # Create ZIP
          7z a "Donut_${VERSION}_x64-portable.zip" "$PORTABLE_DIR"

      - name: Create GitHub Release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"

          # Create release (idempotent — skip if tag/release already exists)
          gh release create "$TAG" \
            --title "Donut Browser $TAG" \
            --notes "See the assets to download this version and install." \
            --draft=false \
            --prerelease=false \
            2>/dev/null || echo "Release $TAG already exists, uploading assets..."

          # Upload NSIS installer
          INSTALLER="Donut_${VERSION}_x64-setup.exe"
          cp "$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)" "$INSTALLER"
          gh release upload "$TAG" "$INSTALLER" --clobber

          # Upload portable ZIP
          gh release upload "$TAG" "Donut_${VERSION}_x64-portable.zip" --clobber
